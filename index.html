<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Limbo Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#030303;
    --black2:#080808;
    --dark:#111;
    --dark2:#191919;
    --gray:#8a8a8a;
    --light:#dcdcdc;
    --white:#fff;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;

    font-family:"Orbitron",sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(180,180,180,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(255,255,255,.05),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(180,180,180,.045),
            transparent 25%
        ),
        #030303;
}

/* =========================================
   MOVING GRID
========================================= */

.grid{
    position:fixed;
    width:220%;
    height:220%;
    left:-60%;
    top:-55%;

    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:65px 65px;

    transform:
        perspective(500px)
        rotateX(60deg);

    opacity:.28;

    animation:
        gridMove 11s linear infinite;
}

@keyframes gridMove{
    0%{
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(0);
    }

    100%{
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(65px);
    }
}

/* =========================================
   ROTATING LIGHT
========================================= */

.light-ring{
    position:fixed;
    width:620px;
    height:620px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.045);

    box-shadow:
        0 0 40px rgba(255,255,255,.025),
        inset 0 0 40px rgba(255,255,255,.025);

    animation:
        ringRotate 18s linear infinite;

    pointer-events:none;
}

.light-ring::before,
.light-ring::after{
    content:"";
    position:absolute;

    inset:45px;

    border-radius:50%;

    border:1px dashed rgba(255,255,255,.035);
}

.light-ring::after{
    inset:100px;
    border-style:solid;
}

@keyframes ringRotate{
    from{
        transform:rotate(0deg) scale(1);
    }

    to{
        transform:rotate(360deg) scale(1.05);
    }
}

/* =========================================
   AMBIENT ORBS
========================================= */

.orb{
    position:fixed;

    width:300px;
    height:300px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(220,220,220,.08),
            transparent 68%
        );

    filter:blur(15px);

    pointer-events:none;

    animation:
        orbFloat 9s ease-in-out infinite alternate;
}

.orb.one{
    top:-140px;
    left:-100px;
}

.orb.two{
    right:-130px;
    bottom:-120px;

    animation-delay:3s;
}

@keyframes orbFloat{
    0%{
        transform:
            translate(0,0)
            scale(.8);
    }

    100%{
        transform:
            translate(100px,70px)
            scale(1.3);
    }
}

/* =========================================
   PARTICLES
========================================= */

.particles{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 6px #fff,
        0 0 14px #aaa,
        0 0 25px #777;

    opacity:0;

    animation:
        particleUp linear infinite;
}

.particle:nth-child(1){
    left:5%;
    animation-duration:6s;
    animation-delay:0s;
}

.particle:nth-child(2){
    left:12%;
    animation-duration:8s;
    animation-delay:2s;
}

.particle:nth-child(3){
    left:20%;
    animation-duration:7s;
    animation-delay:4s;
}

.particle:nth-child(4){
    left:29%;
    animation-duration:10s;
    animation-delay:1s;
}

.particle:nth-child(5){
    left:39%;
    animation-duration:8s;
    animation-delay:5s;
}

.particle:nth-child(6){
    left:48%;
    animation-duration:7s;
    animation-delay:2s;
}

.particle:nth-child(7){
    left:57%;
    animation-duration:11s;
    animation-delay:4s;
}

.particle:nth-child(8){
    left:66%;
    animation-duration:8s;
    animation-delay:1s;
}

.particle:nth-child(9){
    left:75%;
    animation-duration:9s;
    animation-delay:6s;
}

.particle:nth-child(10){
    left:84%;
    animation-duration:7s;
    animation-delay:3s;
}

.particle:nth-child(11){
    left:92%;
    animation-duration:12s;
    animation-delay:5s;
}

.particle:nth-child(12){
    left:97%;
    animation-duration:9s;
    animation-delay:7s;
}

@keyframes particleUp{

    0%{
        top:110%;
        opacity:0;
        transform:
            translateX(0)
            scale(.3);
    }

    10%{
        opacity:.8;
    }

    50%{
        transform:
            translateX(30px)
            scale(1);
    }

    90%{
        opacity:.5;
    }

    100%{
        top:-10%;
        opacity:0;
        transform:
            translateX(-25px)
            scale(1.5);
    }
}

/* =========================================
   MAIN
========================================= */

.wrapper{
    width:min(92%,470px);

    position:relative;
    z-index:20;

    animation:
        pageIn 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{

    0%{
        opacity:0;
        transform:
            translateY(45px)
            scale(.9);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================
   CARD
========================================= */

.card{
    position:relative;

    padding:42px 32px 31px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(29,29,29,.97),
            rgba(5,5,5,.985)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 25px 80px rgba(0,0,0,.8),
        0 0 50px rgba(255,255,255,.035),
        inset 0 0 35px rgba(255,255,255,.025);

    overflow:hidden;
}

/* animated border */

.card::before{
    content:"";

    position:absolute;
    inset:-2px;

    border-radius:32px;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            transparent 35%,
            rgba(255,255,255,.4),
            transparent 43%,
            transparent 70%,
            rgba(255,255,255,.18),
            transparent 80%
        );

    z-index:-1;

    animation:
        borderRotate 5s linear infinite;
}

@keyframes borderRotate{
    to{
        transform:rotate(360deg);
    }
}

/* scan line */

.card .scan{
    position:absolute;

    top:-20%;
    left:0;

    width:100%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    box-shadow:
        0 0 12px rgba(255,255,255,.25);

    animation:
        scanMove 4s linear infinite;

    pointer-events:none;
}

@keyframes scanMove{
    0%{
        top:-10%;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    70%{
        opacity:.6;
    }

    100%{
        top:110%;
        opacity:0;
    }
}

/* =========================================
   LOGO CONTAINER
========================================= */

.logo-area{
    width:150px;
    height:150px;

    margin:0 auto 19px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

/* rotating outer rings */

.logo-area::before{
    content:"";

    position:absolute;

    width:135px;
    height:135px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.16);

    border-top-color:#fff;
    border-right-color:transparent;

    animation:
        logoOrbit 5s linear infinite;
}

.logo-area::after{
    content:"";

    position:absolute;

    width:115px;
    height:115px;

    border-radius:50%;

    border:
        1px dashed rgba(255,255,255,.12);

    animation:
        logoOrbitReverse 7s linear infinite;
}

@keyframes logoOrbit{
    to{
        transform:rotate(360deg);
    }
}

@keyframes logoOrbitReverse{
    to{
        transform:rotate(-360deg);
    }
}

/* =========================================
   LOGO L
========================================= */

.logo{
    position:relative;

    width:92px;
    height:92px;

    display:flex;
    align-items:center;
    justify-content:center;

    /* IMPORTANT:
       L is perfectly straight */
    transform:none !important;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #303030,
            #080808
        );

    border:2px solid rgba(235,235,235,.65);

    color:#f7f7f7;

    font-family:"Orbitron",sans-serif;

    font-size:56px;
    font-weight:900;

    /* no italic */
    font-style:normal;

    /* no negative letter spacing */
    letter-spacing:0;

    line-height:1;

    text-align:center;

    padding:0;

    text-indent:0;

    text-shadow:
        0 0 7px #fff,
        0 0 18px rgba(255,255,255,.65),
        0 0 35px rgba(190,190,190,.35);

    box-shadow:
        0 0 18px rgba(255,255,255,.16),
        0 0 45px rgba(190,190,190,.12),
        inset 0 0 25px rgba(255,255,255,.07);

    animation:
        logoPulse 2.2s ease-in-out infinite;
}

.logo::before{
    content:"";

    position:absolute;

    inset:6px;

    border-radius:19px;

    border:1px solid rgba(255,255,255,.16);

    pointer-events:none;
}

.logo::after{
    content:"";

    position:absolute;

    width:115px;
    height:115px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.07);

    animation:
        logoGlowRing 2.5s ease-out infinite;
}

@keyframes logoPulse{

    0%,100%{
        box-shadow:
            0 0 15px rgba(255,255,255,.13),
            0 0 40px rgba(190,190,190,.09),
            inset 0 0 20px rgba(255,255,255,.05);

        text-shadow:
            0 0 7px #fff,
            0 0 18px rgba(255,255,255,.55),
            0 0 30px rgba(190,190,190,.25);
    }

    50%{
        box-shadow:
            0 0 28px rgba(255,255,255,.25),
            0 0 70px rgba(190,190,190,.18),
            inset 0 0 30px rgba(255,255,255,.1);

        text-shadow:
            0 0 9px #fff,
            0 0 24px rgba(255,255,255,.8),
            0 0 45px rgba(210,210,210,.45);
    }
}

@keyframes logoGlowRing{

    0%{
        transform:scale(.75);
        opacity:.5;
    }

    100%{
        transform:scale(1.45);
        opacity:0;
    }
}

/* =========================================
   TITLE
========================================= */

.title{
    text-align:center;

    color:#f4f4f4;

    font-size:
        clamp(27px,7vw,38px);

    line-height:1.15;

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:10px;

    text-shadow:
        0 2px 0 #202020,
        0 0 10px rgba(255,255,255,.2),
        0 0 28px rgba(255,255,255,.12);

    animation:
        titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow{

    0%,100%{
        text-shadow:
            0 2px 0 #202020,
            0 0 10px rgba(255,255,255,.18),
            0 0 25px rgba(255,255,255,.08);
    }

    50%{
        text-shadow:
            0 2px 0 #202020,
            0 0 15px rgba(255,255,255,.35),
            0 0 38px rgba(255,255,255,.17);
    }
}

.subtitle{
    text-align:center;

    color:#858585;

    font-family:Arial,sans-serif;

    font-size:13px;

    letter-spacing:.7px;

    margin-bottom:28px;
}

/* =========================================
   KEY BOX
========================================= */

.key-box{
    position:relative;

    padding:18px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.012)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.025);

    margin-bottom:15px;

    transition:
        .35s ease;
}

.key-box:hover{
    transform:translateY(-2px);

    border-color:
        rgba(255,255,255,.38);

    box-shadow:
        0 0 25px rgba(255,255,255,.07),
        inset 0 0 25px rgba(255,255,255,.04);
}

.key-label{
    display:block;

    color:#999;

    font-size:9px;

    font-weight:800;

    letter-spacing:3px;

    margin-bottom:9px;
}

.key{
    width:100%;

    border:none;
    outline:none;

    background:transparent;

    color:#e8e8e8;

    font-family:Arial,sans-serif;

    font-size:12px;

    font-weight:600;

    word-break:break-all;
}

/* =========================================
   BUTTON
========================================= */

.copy-btn{
    position:relative;

    width:100%;
    height:58px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    overflow:hidden;

    color:#080808;

    background:
        linear-gradient(
            135deg,
            #f3f3f3,
            #a1a1a1
        );

    font-family:"Orbitron",sans-serif;

    font-size:14px;

    font-weight:900;

    letter-spacing:2px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5),
        0 0 25px rgba(255,255,255,.08);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.copy-btn::before{
    content:"";

    position:absolute;

    left:-130%;
    top:0;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.75),
            transparent
        );

    transform:skewX(-22deg);

    transition:.65s;
}

.copy-btn:hover::before{
    left:150%;
}

.copy-btn:hover{
    transform:translateY(-4px);

    box-shadow:
        0 16px 40px rgba(0,0,0,.65),
        0 0 35px rgba(255,255,255,.16);
}

.copy-btn:active{
    transform:scale(.96);
}

/* =========================================
   STATUS
========================================= */

.status{
    min-height:19px;

    margin-top:14px;

    text-align:center;

    color:#999;

    font-family:Arial,sans-serif;

    font-size:12px;

    opacity:0;

    transform:translateY(5px);

    transition:.3s ease;
}

.status.show{
    opacity:1;

    transform:translateY(0);

    color:#e0e0e0;

    text-shadow:
        0 0 10px rgba(255,255,255,.25);
}

/* =========================================
   FOOTER
========================================= */

.footer{
    margin-top:22px;

    text-align:center;

    color:#505050;

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:2px;
}

.footer span{
    color:#aaa;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:500px){

    .wrapper{
        width:92%;
    }

    .card{
        padding:
            34px 21px 28px;
        border-radius:26px;
    }

    .logo-area{
        width:135px;
        height:135px;
    }

    .logo-area::before{
        width:120px;
        height:120px;
    }

    .logo-area::after{
        width:103px;
        height:103px;
    }

    .logo{
        width:82px;
        height:82px;
        font-size:49px;
    }

    .title{
        font-size:27px;
    }

    .key{
        font-size:10.5px;
    }

    .copy-btn{
        height:55px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="grid"></div>

<div class="light-ring"></div>

<div class="orb one"></div>
<div class="orb two"></div>


<!-- Particles -->
<div class="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

</div>


<!-- Main -->
<div class="wrapper">

    <div class="card">

        <!-- Animated scan -->
        <div class="scan"></div>


        <!-- Straight centered L -->
        <div class="logo-area">

            <div class="logo">L</div>

        </div>


        <!-- Title -->
        <h1 class="title">
            Limbo Hub Key
        </h1>

        <div class="subtitle">
            Your access key is ready
        </div>


        <!-- Key -->
        <div class="key-box">

            <span class="key-label">
                YOUR KEY
            </span>

            <input
                id="key"
                class="key"
                type="text"
                readonly
                value="LimboHubKeyjakklwowiskBalaowkejenwkBdbalqpekenwnBskwowi"
            >

        </div>


        <!-- Button -->
        <button
            class="copy-btn"
            onclick="copyKey()"
        >
            Copy Key
        </button>


        <!-- Status -->
        <div
            id="status"
            class="status"
        >
            Key copied successfully!
        </div>


        <!-- Footer -->
        <div class="footer">
            LIMBO HUB <span>•</span> KEY SYSTEM
        </div>

    </div>

</div>


<script>

function copyKey(){

    const key =
        document.getElementById("key");

    const status =
        document.getElementById("status");

    const button =
        document.querySelector(".copy-btn");

    const value =
        key.value;


    function success(){

        status.textContent =
            "Key copied successfully!";

        status.classList.add("show");

        button.textContent =
            "Copied ✓";

        setTimeout(function(){

            status.classList.remove("show");

            button.textContent =
                "Copy Key";

        },2200);
    }


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(value)
            .then(success)
            .catch(function(){

                fallbackCopy(value);

                success();

            });

    }else{

        fallbackCopy(value);

        success();

    }

}


function fallbackCopy(text){

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    document.body.appendChild(
        textarea
    );

    textarea.focus();

    textarea.select();

    try{

        document.execCommand("copy");

    }catch(error){}

    document.body.removeChild(
        textarea
    );
}

</script>

</body>
</html>
